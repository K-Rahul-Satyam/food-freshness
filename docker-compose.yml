services:
  # Primary Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: food_freshness_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: food_freshness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Secondary Database: MongoDB (NoSQL Telemetry & Feature Tensors)
  mongodb:
    image: mongo:7.0
    container_name: food_freshness_mongodb
    environment:
      MONGO_INITDB_DATABASE: food_freshness
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend: FastAPI + Computer Vision Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_freshness_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/food_freshness
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: food_freshness
      SECRET_KEY: freshguard_super_secret_jwt_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # Frontend: React.js + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food_freshness_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
