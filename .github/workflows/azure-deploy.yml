name: Deploy Food Freshness to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.ACR_NAME }} # e.g. foodfreshnessacr
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }} # e.g. rg-foodfreshness
  LOCATION: eastus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/food-freshness-backend:latest ./backend
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/food-freshness-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/food-freshness-frontend:latest ./frontend
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/food-freshness-frontend:latest

      - name: Deploy to Azure App Service / Azure Container Instances
        run: |
          echo "Containers built and pushed to ACR successfully."
